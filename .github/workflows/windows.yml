name: Windows native build
on:
  push:
    branches: [winui-native]
  pull_request:
    branches: [winui-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Package installer and portable archive
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          ./scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: GopeedNative-windows-x64
          path: |
            artifacts/GopeedNative-Portable-0.3.0-x64.zip
            artifacts/GopeedNative-Setup-0.3.0-x64.exe
          compression-level: 0
